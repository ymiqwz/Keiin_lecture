const calendar = document.getElementById("calendar");

    "2026-3-5": { text: "🌙 Ramadan", class: "ramadan" },
    "2026-3-6": { text: "🌙 Ramadan", class: "ramadan" },
    "2026-3-7": { text: "🌙 Ramadan", class: "ramadan" },

    "2026-3-8": { text: "🥊 UFC: Holloway vs Oliveira", class: "ufc" },

    "2026-2-3": { text: "🔥 UFC Fight Night", class: "ufc" },

    // February hobbies
    "2026-2-4": { text: "🏀 Basketball training", class: "special" },

    "2026-2-25": { text: "🎮 Play games", class: "special" },
    "2026-2-26": { text: "🚶 Walk outside", class: "special" },

    "2026-3-26": { text: "🏀 Basketball", class: "special" },
    "2026-3-27": { text: "🎮 Play games", class: "special" },
    "2026-3-28": { text: "😴 Rest day", class: "special" }

};

function renderCalendar(month, year) {

    calendar.innerHTML = "";

    const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];

    monthTitle.innerHTML = `🌸 ${monthNames[month]} ${year} 🌸`;

    const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    dayNames.forEach(d=>{
        const el=document.createElement("div");
        el.className="day-name";
        el.textContent=d;
        calendar.appendChild(el);
    });

    const firstDay = new Date(year, month, 1);
    const startDay = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month+1, 0).getDate();

    for(let i=0;i<startDay;i++){
        const empty=document.createElement("div");
        empty.className="day empty";
        calendar.appendChild(empty);
    }

    const today=new Date();

    for(let d=1; d<=daysInMonth; d++){

        const day=document.createElement("div");
        day.className="day";

        const date=document.createElement("div");
        date.className="date";
        date.textContent=d;
        day.appendChild(date);

        const key=`${year}-${month+1}-${d}`;
        if(events[key]){
            const event=document.createElement("div");
            event.className="event "+events[key].class;
            event.textContent=events[key].text;
            day.appendChild(event);
        }

        if(
            today.getDate()===d &&
            today.getMonth()===month &&
            today.getFullYear()===year
        ){
            day.classList.add("today");
        }

        calendar.appendChild(day);
    }
}

document.getElementById("prevMonth").onclick=()=>{
    currentMonth--;
    renderCalendar(currentMonth,currentYear);
};

document.getElementById("nextMonth").onclick=()=>{
    currentMonth++;
    renderCalendar(currentMonth,currentYear);
};

document.addEventListener("keydown", function(e){
    if(e.ctrlKey && e.key==="s"){
        e.preventDefault();

        const html=document.documentElement.outerHTML;
        const blob=new Blob([html],{type:"text/html"});

        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download="calendar.html";
        a.click();
    }
});

renderCalendar(currentMonth,currentYear);

</script>

</body>
</html>
